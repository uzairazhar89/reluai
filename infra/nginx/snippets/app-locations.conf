# Application routing, shared by the HTTP (staging) and HTTPS (production) servers.
include /etc/nginx/snippets/legacy-routes.conf;

# Internal endpoints are reachable only on the Docker network, never from the internet.
location ~ ^/(internal/|metrics|healthz|readyz) {
    return 404;
}

# API: 10 requests/second per client for reads (the dashboard polls every few seconds
# while a run is active); writes additionally count against 6/minute (see nginx.conf).
# The API applies its own per-visitor quotas and body limits on top.
location /api/ {
    limit_req zone=api_write burst=3 nodelay;
    limit_req zone=api burst=40 nodelay;
    limit_conn perip 20;
    client_max_body_size 16k;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# CSV analyst: questions are frequent and small; uploads are rare and up to 2 MB.
location /api/csv/ {
    limit_req zone=csv_ask burst=10 nodelay;
    limit_req zone=api burst=40 nodelay;
    limit_conn perip 20;
    client_max_body_size 16k;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

location = /api/csv/uploads {
    limit_req zone=api_write burst=3 nodelay;
    limit_req zone=api burst=40 nodelay;
    limit_conn perip 4;
    client_max_body_size 2200k;
    client_body_timeout 30s;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# Support agent: a turn may take several model calls (up to 25 s of agent time).
location /api/support/ {
    limit_req zone=support_turn burst=6 nodelay;
    limit_req zone=api burst=40 nodelay;
    limit_conn perip 10;
    client_max_body_size 8k;
    proxy_read_timeout 45s;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# Document Intelligence: questions and invoice runs (a scanned invoice takes a few seconds
# of OCR); the page polls a document's status while it is being read.
location /api/documents/ {
    limit_req zone=docs_ask burst=6 nodelay;
    limit_req zone=api burst=40 nodelay;
    limit_conn perip 10;
    client_max_body_size 8k;
    proxy_read_timeout 45s;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# PDF uploads (for questions, or read once as an invoice): up to 10 MB plus multipart
# overhead; rare, so the strict write limit applies.
location ~ ^/api/documents/(invoices/)?uploads$ {
    limit_req zone=api_write burst=3 nodelay;
    limit_req zone=api burst=40 nodelay;
    limit_conn perip 2;
    client_max_body_size 11m;
    client_body_timeout 60s;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# Fingerprinted Next.js assets are immutable.
location /_next/static/ {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    include /etc/nginx/snippets/proxy.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

location / {
    limit_req zone=general burst=60 nodelay;
    limit_conn perip 40;
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    include /etc/nginx/snippets/proxy.conf;
}
