# Security headers for every response. `always` applies them to error pages too.
# The site loads no third-party scripts, styles, fonts or trackers. 'unsafe-inline' for
# scripts is required by Next.js's statically rendered hydration payload (nonces would force
# every page to render dynamically); with no third-party origins allowed, injected markup
# still cannot load or send anything off-site. HTTPS is enforced by the redirect and HSTS in
# the production server block, not by upgrade-insecure-requests, so the same headers also
# work for the plain-HTTP staging server.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Request-ID $request_id always;
