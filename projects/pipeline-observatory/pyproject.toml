[project]
name = "reluai-pipeline"
version = "0.1.0"
description = "Data Pipeline Observatory: production-style ETL on real retail invoices with validation, quarantine, idempotent loads and data-quality monitoring"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.142",
  "httpx>=0.28",
  "pandas>=3.0",
  "pyarrow>=25",
  "reluai-core",
  "reluai-datasets",
  "tenacity>=9.1",
  "uvicorn>=0.54",
]

[project.scripts]
reluai-pipeline = "reluai_pipeline.cli:main"

[tool.uv.sources]
reluai-core = { workspace = true }
reluai-datasets = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reluai_pipeline"]
