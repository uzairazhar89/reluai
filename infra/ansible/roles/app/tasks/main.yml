- name: Deploy user (runs releases; member of the docker group)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: docker
    append: true
  register: app_deploy_account

- name: Deploy gate (the only command the CI deploy key may run)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/deploy-gate.sh"
    dest: /usr/local/bin/reluai-deploy-gate
    owner: root
    group: root
    mode: "0755"

- name: Deploy user's SSH directory
  ansible.builtin.file:
    path: "{{ app_deploy_account.home }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0700"

# The whole file is managed: a key not listed in the variables is removed, so no key can be
# left behind with more rights than intended. Owned by root, read only by sshd.
- name: Deploy user's authorised SSH keys (CI key restricted to the deploy gate)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "{{ app_deploy_account.home }}/.ssh/authorized_keys"
    owner: root
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Remind about the CI deploy key
  ansible.builtin.debug:
    msg: >-
      deploy_ci_public_key is empty, so GitHub Actions cannot deploy yet. Re-run with
      -e 'deploy_ci_public_key="ssh-ed25519 AAAA... reluai-ci-deploy"'.
  when: not deploy_ci_public_key

- name: Application checkout (compose files, nginx templates, scripts)
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_root }}"
    version: "{{ app_repo_version }}"
    update: true
  become_user: "{{ deploy_user }}"
  become: true

- name: Secrets file must be created by hand from .env.example
  ansible.builtin.stat:
    path: "{{ app_root }}/infra/compose/.env"
  register: app_envfile

- name: Remind about the secrets file
  ansible.builtin.debug:
    msg: >-
      {{ app_root }}/infra/compose/.env is missing. Copy .env.example, fill in the secrets
      (chmod 600, owner {{ deploy_user }}), then run the first deploy.
  when: not app_envfile.stat.exists

- name: Restrict secrets file permissions
  ansible.builtin.file:
    path: "{{ app_root }}/infra/compose/.env"
    owner: "{{ deploy_user }}"
    mode: "0600"
  when: app_envfile.stat.exists

- name: Start the stack on boot
  ansible.builtin.template:
    src: reluai.service.j2
    dest: /etc/systemd/system/reluai.service
    mode: "0644"
  notify: Reload systemd

- name: Enable the stack unit
  ansible.builtin.systemd:
    name: reluai
    enabled: true
    daemon_reload: true
