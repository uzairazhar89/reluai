name: release

# Builds the four production images after CI passes on main, scans them, publishes SBOMs
# and pushes to GHCR tagged with the commit SHA. The VPS only ever pulls these images.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, file: infra/docker/python.Dockerfile, target: api, context: . }
          - { name: worker, file: infra/docker/python.Dockerfile, target: worker, context: . }
          - { name: web, file: infra/docker/web.Dockerfile, target: "", context: . }
          - { name: nginx, file: infra/nginx/Dockerfile, target: "", context: infra/nginx }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/reluai-${{ matrix.name }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (with SBOM and provenance attestations)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      # Gate: stop the release on a critical vulnerability that has a fix available.
      - name: Vulnerability gate (critical, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      # Report: every finding, uploaded to the repository's Security tab (never fails the run).
      - name: Vulnerability report (all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.SHA }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
