[project]
name = "reluai-datasets"
version = "0.1.0"
description = "Dataset manifest, verified fetching and provenance records for openly licensed data"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28",
  "openpyxl>=3.1",
  "pandas>=3.0",
  "pyarrow>=25",
  "pydantic>=2.13",
  "pyreadr>=0.5.7",
  "pyyaml>=6.0",
  "reluai-core",
]

[project.scripts]
reluai-data = "reluai_datasets.cli:main"

[tool.uv.sources]
reluai-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reluai_datasets"]
