# Developer convenience for `uv run alembic -c apps/api/alembic.ini revision --autogenerate -m ...`.
# Deployments use `reluai db migrate`, which configures Alembic in code.
[alembic]
script_location = %(here)s/src/reluai_api/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
