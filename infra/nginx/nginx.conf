# Edge proxy for reluai.cloud — the only container with published ports.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 30s;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Default request-body cap; individual locations raise it only where uploads are allowed.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
        '"request_id":"$request_id","user_agent":"$http_user_agent","referer":"$http_referer"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml image/svg+xml application/problem+json;

    # Per-client rate limits (requests) and concurrency limits (connections).
    limit_req_zone  $binary_remote_addr zone=general:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m       rate=10r/s;
    # Writes (starting a run, sending a message) share a strict per-client limit. Only
    # non-GET requests get a key; requests with an empty key are not counted, so dashboard
    # polling is limited by the general API zone alone.
    map $request_method $write_limit_key {
        GET     "";
        HEAD    "";
        OPTIONS "";
        default $binary_remote_addr;
    }
    limit_req_zone  $write_limit_key zone=api_write:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Docker's embedded DNS. Upstreams are resolved per request (via variables in
    # proxy_pass), so nginx starts even when the app containers are down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
