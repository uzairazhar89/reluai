# Password login is switched off below. Refuse to continue unless at least one SSH key is
# installed for root or a user, so provisioning can never lock the administrator out.
- name: Count installed SSH public keys
  ansible.builtin.shell: |
    set -o pipefail
    cat /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys 2>/dev/null \
      | grep -cE '^(ssh-(ed25519|rsa)|ecdsa-sha2-|sk-)' || true
  args:
    executable: /bin/bash
  register: base_ssh_keys
  changed_when: false

- name: Stop if no SSH key is installed
  ansible.builtin.assert:
    that: base_ssh_keys.stdout | int > 0
    fail_msg: >-
      No SSH public key is installed on this server. Add yours first (ssh-copy-id, or paste
      it into ~/.ssh/authorized_keys) and check that key login works, otherwise disabling
      password login would lock you out.

- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    # acl: lets Ansible hand temporary files to the deploy user; python3-debian: needed by
    # the deb822_repository module in the docker role.
    name: [ufw, fail2ban, unattended-upgrades, curl, git, ca-certificates, htop, jq, acl, python3-debian]
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Harden SSH (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-reluai.conf
    content: |
      PermitRootLogin {{ ssh_permit_root_login }}
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# Some provider images (Hostinger's, for one) ship an sshd_config without the Include line,
# so every file in sshd_config.d/, including the one above, is silently ignored.
- name: Make sshd read sshd_config.d
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Include\s+/etc/ssh/sshd_config\.d/'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Apply SSH changes now
  ansible.builtin.meta: flush_handlers

- name: Read the SSH settings in effect
  ansible.builtin.command: /usr/sbin/sshd -T
  register: base_sshd_effective
  changed_when: false

- name: Check that password login is really off
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in base_sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in base_sshd_effective.stdout_lines"
      - "base_sshd_effective_root in base_sshd_effective.stdout_lines"
    fail_msg: >-
      sshd is not using the hardened settings (an earlier line or file takes precedence).
      Check with: sshd -T | grep -Ei 'passwordauth|kbdinteractive|permitrootlogin'
  vars:
    # sshd -T reports prohibit-password under its older name.
    base_sshd_effective_root: >-
      permitrootlogin {{ 'without-password' if ssh_permit_root_login == 'prohibit-password'
      else ssh_permit_root_login }}

- name: Firewall default - deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Firewall default - allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["{{ admin_ssh_port }}", "80", "443"]

- name: Enable firewall
  community.general.ufw:
    state: enabled

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
    mode: "0644"
  notify: Restart fail2ban

- name: Check for swap file
  ansible.builtin.stat:
    path: /swapfile
  register: base_swapfile

- name: Create swap file (headroom for memory spikes on an 8 GB host)
  when: not base_swapfile.stat.exists
  block:
    - name: Allocate swap
      ansible.builtin.command: fallocate -l {{ swap_size_mb }}M /swapfile
      changed_when: true
    - name: Secure swap file
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
    - name: Format swap
      ansible.builtin.command: mkswap /swapfile
      changed_when: true
    - name: Enable swap
      ansible.builtin.command: swapon /swapfile
      changed_when: true

- name: Persist swap
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
