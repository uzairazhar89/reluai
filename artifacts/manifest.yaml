# Every third-party dataset, model and media file used by reluai.cloud.
# Nothing listed here is committed to git: it is fetched at image-build time (or by
# `reluai-data fetch <id>`) and accepted only if it passes the content checks below.
# The website's /data page is generated from this file.
version: 1
datasets:
  - id: online-retail-ii
    title: Online Retail II
    publisher: UCI Machine Learning Repository
    homepage: https://archive.ics.uci.edu/dataset/502/online+retail+ii
    doi: 10.24432/C5CG6D
    description: >-
      All transactions of a UK-based, registered, non-store online retailer of gift items
      between 1 December 2009 and 9 December 2011: 1,067,371 invoice lines with invoice
      number (prefix C = cancellation), stock code, description, quantity, timestamp,
      unit price in GBP, anonymised customer ID and country. The company and its customers
      are not named in the dataset.
    real_data: true
    modifications:
      - Split into 25 monthly CSV "drops" and a derived product catalogue and customer
        register so the pipeline demo has realistic sources. Values are not altered.
      - Failure scenarios (corrupted drop, source outage) apply simulated faults to a copy
        at run time and are labelled as simulated.
      - The CSV analyst loads the whole table into a read-only DuckDB file with renamed
        columns, a computed revenue column (quantity × price) and a cancellation flag.
        Values are not altered.
      - The support agent uses the invoice lines of customers with an ID, with exact
        duplicate lines removed. Shipments, the service policy, tickets and customer
        messages around them are simulated and labelled as such.
      - Document Intelligence draws 96 invoices (with credit notes and invoices without a
        customer ID) as PDFs in generated layouts, 28 of them also as simulated scans, to
        measure invoice extraction against the records. Each page states that it is a
        rendering of dataset records, not a real invoice; the retailer is not named. Values
        are not altered.
    licence:
      name: CC BY 4.0
      url: https://creativecommons.org/licenses/by/4.0/
      attribution: >-
        Chen, D. (2012). Online Retail II [Dataset]. UCI Machine Learning Repository.
        https://doi.org/10.24432/C5CG6D. Licensed under CC BY 4.0.
      notes: >-
        Licence as stated on the UCI dataset page. An earlier redistribution (the
        onlineretail2 R package, 2020) quotes older donor terms restricting use to
        non-commercial purposes; this site is a non-commercial portfolio demonstration.
    sources:
      - kind: uci_zip_xlsx
        role: canonical
        url: https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip
        max_bytes: 104857600
        notes: Excel workbook with two yearly sheets that overlap on 1-9 December 2010.
      - kind: rda
        role: mirror
        url: https://raw.githubusercontent.com/allanvc/onlineretail2/35b2729b7bb4c46831cb4fb4efde29edd3a8dd7e/data/onlineretail2.rda
        sha256: be2480b1fcb1fa123f90d731f63ab3cf44f6c97cba0a38eabee93759d411c6f7
        max_bytes: 20971520
        notes: >-
          Unmodified redistribution in the onlineretail2 R package (pinned commit). Used
          when the canonical host is unreachable; accepted only if the content checks pass.
    checks:
      rows: 1067371
      columns: [invoice, stock_code, description, quantity, invoice_date, price, customer_id, country]
      min_timestamp: 2009-12-01T07:45:00
      max_timestamp: 2011-12-09T12:50:00
      content_sha256: 56dbc9b75d5834fc0a3a451e126601b14cb4cbc3fed774161f864eacddf18e54
      fingerprint_version: 1
    used_by: [pipeline-observatory, csv-analyst, support-agent, document-intelligence]

# Models and documents fetched at image-build time from pinned sources (or installed from a
# hash-locked package) and listed on the /data page.
artifacts:
  - id: nist-ai-100-1
    kind: document
    title: Artificial Intelligence Risk Management Framework (AI RMF 1.0), NIST AI 100-1
    publisher: National Institute of Standards and Technology (NIST)
    homepage: https://doi.org/10.6028/NIST.AI.100-1
    description: >-
      The 48-page framework NIST published in January 2023 for managing risks of AI systems.
      The Document Q&A demo offers it as a ready-indexed sample and its evaluation question set
      is written against it.
    real_data: true
    modifications:
      - Read with the same pipeline as uploads (text layer, running headers and page numbers
        removed, headings and paragraphs rebuilt), split into passages and embedded at image
        build time. The text itself is not altered.
    licence:
      name: US Government work
      url: https://www.nist.gov/oism/copyrights
      attribution: >-
        National Institute of Standards and Technology (2023). Artificial Intelligence Risk
        Management Framework (AI RMF 1.0). NIST AI 100-1. https://doi.org/10.6028/NIST.AI.100-1
      notes: >-
        Works of the US Government are not subject to copyright protection in the United States.
    files:
      - url: https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf
        path: /var/lib/reluai/data/docs/sample.json (extracted; the PDF is not kept)
        sha256: 7576edb531d9848825814ee88e28b1795d3a84b435b4b797d3670eafdc4a89f1
        bytes: 1946127
    used_by: [document-intelligence]

  - id: bge-small-en-v1.5
    kind: model
    title: bge-small-en-v1.5 (sentence embeddings)
    publisher: Beijing Academy of Artificial Intelligence (BAAI)
    homepage: https://huggingface.co/BAAI/bge-small-en-v1.5
    description: >-
      A 33-million-parameter English embedding model producing 384-dimensional vectors, used
      for meaning-based search in the Document Q&A demo. Runs on CPU with ONNX Runtime.
    real_data: true
    modifications:
      - The ONNX export published in the model repository is quantised to 8-bit weights
        (ONNX Runtime dynamic quantisation, per channel) when the server image is built, and
        only the quantised copy is kept. With the versions pinned in uv.lock the result is
        reproducible; its SHA-256 is
        f8b2217838ea27564f870f96e377cb6e5ca0fa37dec9599cf305d5de011d6b7f.
      - Tokenisation is reimplemented in Python from the published vocabulary and checked
        against the reference tokenizer.
    licence:
      name: MIT
      url: https://huggingface.co/BAAI/bge-small-en-v1.5/blob/main/README.md
      attribution: >-
        Xiao, S., Liu, Z., Zhang, P. and Muennighoff, N. (2023). C-Pack: Packaged Resources To
        Advance General Chinese Embedding. BAAI bge-small-en-v1.5, MIT licence.
    files:
      - url: https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/5c38ec7c405ec4b44b94cc5a9bb96e735b38267a/onnx/model.onnx
        path: /var/lib/reluai/data/docs/models/bge-small-en-v1.5.onnx
        sha256: 828e1496d7fabb79cfa4dcd84fa38625c0d3d21da474a00f08db0f559940cf35
        bytes: 133093490
      - url: https://huggingface.co/BAAI/bge-small-en-v1.5/resolve/5c38ec7c405ec4b44b94cc5a9bb96e735b38267a/tokenizer.json
        path: /var/lib/reluai/data/docs/models/bge-small-en-v1.5.tokenizer.json
        sha256: d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66
        bytes: 711396
    used_by: [document-intelligence]

  - id: pp-ocrv6-small
    kind: model
    title: PP-OCRv6 small text detection and recognition (via RapidOCR)
    publisher: PaddlePaddle (PaddleOCR); ONNX conversion by the RapidOCR project
    homepage: https://github.com/RapidAI/RapidOCR
    description: >-
      Text detection, orientation and recognition models used to read scanned pages in the
      Document Q&A demo, run on CPU with ONNX Runtime.
    real_data: true
    licence:
      name: Apache 2.0
      url: https://github.com/RapidAI/RapidOCR/blob/main/LICENSE
      attribution: >-
        PaddleOCR (PaddlePaddle), PP-OCRv6 models, Apache 2.0; ONNX models packaged by
        RapidOCR, Apache 2.0.
      notes: >-
        Installed from the rapidocr 3.10.0 wheel on PyPI, whose hash is pinned in uv.lock; the
        models ship inside the wheel, so nothing is downloaded at run time.
    files:
      - url: https://pypi.org/project/rapidocr/3.10.0/
        path: /opt/venv/lib/python3.13/site-packages/rapidocr/models/
    used_by: [document-intelligence]
