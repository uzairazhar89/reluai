# Application routing, shared by the HTTP (staging) and HTTPS (production) servers.
include /etc/nginx/snippets/legacy-routes.conf;

# Internal endpoints are reachable only on the Docker network, never from the internet.
location ~ ^/(internal/|metrics|healthz|readyz) {
    return 404;
}

# Queueing a pipeline run is expensive: 6 requests/minute per client, small burst.
location = /api/pipeline/runs {
    limit_req zone=api_write burst=3 nodelay;
    limit_req zone=api burst=20 nodelay;
    limit_conn perip 10;
    client_max_body_size 16k;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_conn perip 20;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# Fingerprinted Next.js assets are immutable.
location /_next/static/ {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    include /etc/nginx/snippets/proxy.conf;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
}

location / {
    limit_req zone=general burst=60 nodelay;
    limit_conn perip 40;
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    include /etc/nginx/snippets/proxy.conf;
}
