# Routes from the previous version of the site.
# This is the only file allowed to name the retired microsite path (see
# scripts/check_denylist.py); it exists to answer it with 410 Gone so search engines drop it.
location ~* ^/zarwatech(/.*)?$ {
    return 410;
}

# Retired demos: send visitors to the current projects.
location ^~ /demo/ {
    return 301 /projects;
}

# Retired demo APIs.
location ~ ^/api/(text-to-python|sentiment|image-classifier|csv-analyzer)(/.*)?$ {
    return 410;
}
