[project]
name = "reluai-core"
version = "0.1.0"
description = "Shared platform services: settings, logging, database, job queue, CPU lease, request limits, health and metrics"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.142",
  "orjson>=3.12",
  "prometheus-client>=0.26",
  "procrastinate>=3.10,<3.11",
  "psycopg[binary,pool]>=3.3",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "sqlalchemy>=2.1",
  "structlog>=26.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reluai_core"]
