# Weekly dependency updates as pull requests. CI runs on each one; merge when green.
# Minor and patch updates are grouped so there are few PRs; major updates arrive one by one.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    open-pull-requests-limit: 5
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    open-pull-requests-limit: 5
    groups:
      web-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directories: [/infra/docker, /infra/nginx]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      actions: { patterns: ["*"] }
