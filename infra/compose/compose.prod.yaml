# Production on the VPS: prebuilt images from GHCR (built and scanned in CI), HTTPS.
#   IMAGE_TAG=<git sha> docker compose -f compose.yaml -f compose.prod.yaml up -d

services:
  nginx:
    image: ghcr.io/${GHCR_OWNER:-uzairazhar89}/reluai-nginx:${IMAGE_TAG:?set IMAGE_TAG}
    ports: !override
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-reluai.cloud}
    volumes:
      - ../nginx/templates/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot:ro

  web:
    image: ghcr.io/${GHCR_OWNER:-uzairazhar89}/reluai-web:${IMAGE_TAG:?set IMAGE_TAG}

  api:
    image: ghcr.io/${GHCR_OWNER:-uzairazhar89}/reluai-api:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      RELUAI_ENVIRONMENT: prod

  worker:
    image: ghcr.io/${GHCR_OWNER:-uzairazhar89}/reluai-worker:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      RELUAI_ENVIRONMENT: prod

  migrate:
    image: ghcr.io/${GHCR_OWNER:-uzairazhar89}/reluai-api:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      RELUAI_ENVIRONMENT: prod

  # Obtains the certificate on first run (retrying every 20 minutes until DNS points here),
  # then renews twice a day. nginx reloads within a minute of the files changing.
  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-loop.sh"]
    environment:
      DOMAIN: ${DOMAIN:-reluai.cloud}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ../certbot/certbot-loop.sh:/usr/local/bin/certbot-loop.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks: [edge]
    mem_limit: 128m
    cpus: 0.25

volumes:
  letsencrypt: {}
  certbot-webroot: {}
