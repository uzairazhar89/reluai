# A server that ran Docker before may have Ubuntu's own packages or an older apt source for
# Docker; either makes the Docker CE install below fail. Removing them keeps /var/lib/docker.
- name: Remove distribution Docker packages that conflict with Docker CE
  ansible.builtin.apt:
    name: [docker.io, docker-doc, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
    state: absent

- name: Remove an older Docker apt source (replaced by the deb822 file below)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Docker apt repository (deb822, key fetched and pinned to this repository)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Docker daemon settings (log rotation, no userland proxy)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {"max-size": "10m", "max-file": "3"},
        "userland-proxy": false,
        "live-restore": true
      }
    mode: "0644"
  notify: Restart docker

- name: Docker running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
