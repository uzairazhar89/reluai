# reluai.cloud — base Compose file. Combine with an environment override:
#   staging (laptop): docker compose -f compose.yaml -f compose.staging.yaml up -d --build
#   production (VPS): docker compose -f compose.yaml -f compose.prod.yaml up -d
# Resource limits are sized for a 2 vCPU / 8 GB host; see docs/architecture/resources.md.
name: reluai

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Applied to every service. Application containers also drop all Linux capabilities; nginx
# and postgres keep the defaults they need to bind ports and switch to their own users.
x-no-new-privileges: &no-new-privileges
  security_opt: ["no-new-privileges:true"]

x-app-env: &app-env
  RELUAI_ENVIRONMENT: ${RELUAI_ENVIRONMENT:-staging}
  RELUAI_DATABASE_URL: postgresql+psycopg://reluai_app:${RELUAI_APP_DB_PASSWORD:?set in .env}@postgres:5432/reluai
  RELUAI_MIGRATION_DATABASE_URL: postgresql+psycopg://reluai:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/reluai
  RELUAI_VISITOR_HASH_SECRET: ${RELUAI_VISITOR_HASH_SECRET:?set in .env}
  RELUAI_SITE_URL: https://${DOMAIN:-reluai.cloud}
  RELUAI_LOG_LEVEL: ${RELUAI_LOG_LEVEL:-INFO}
  RELUAI_PIPELINE_CRM_BASE_URL: http://api:8000/internal/crm
  RELUAI_LLM_GROQ_API_KEY: ${RELUAI_LLM_GROQ_API_KEY:-}
  RELUAI_LLM_CEREBRAS_API_KEY: ${RELUAI_LLM_CEREBRAS_API_KEY:-}
  RELUAI_LLM_LOCAL_ENABLED: ${RELUAI_LLM_LOCAL_ENABLED:-false}
  RELUAI_LLM_LOCAL_BASE_URL: http://llm:8080/v1

services:
  nginx:
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_started
    networks: [edge]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 128
    logging: *logging
    <<: *no-new-privileges

  web:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://api:8000
    networks: [edge]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *logging
    <<: *no-new-privileges
    cap_drop: [ALL]

  api:
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [edge, backend]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: *logging
    <<: *no-new-privileges
    cap_drop: [ALL]

  worker:
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    logging: *logging
    <<: *no-new-privileges
    cap_drop: [ALL]

  # One-off: applies migrations as the schema owner, then exits. API and worker wait for it.
  migrate:
    restart: "no"
    environment: *app-env
    command: ["reluai", "db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 512m
    logging: *logging
    <<: *no-new-privileges
    cap_drop: [ALL]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: reluai
      POSTGRES_USER: reluai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      RELUAI_APP_DB_PASSWORD: ${RELUAI_APP_DB_PASSWORD:?set in .env}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=1000
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
      - backups:/backups
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reluai -d reluai"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    cpus: 0.75
    shm_size: 128m
    logging: *logging
    <<: *no-new-privileges

  # Optional local model (enable with: --profile llm). Model files live in the `models`
  # volume; see docs/runbooks/local-llm.md.
  llm:
    profiles: ["llm"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080",
              "-c", "4096", "-t", "2", "-np", "1", "--jinja"]
    volumes:
      - models:/models:ro
    networks: [backend]
    mem_limit: 2g
    cpus: 1.5
    logging: *logging
    <<: *no-new-privileges
    cap_drop: [ALL]

networks:
  edge: {}
  backend:
    internal: true

volumes:
  pgdata: {}
  backups: {}
  models: {}
