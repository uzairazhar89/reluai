[project]
name = "reluai-inference"
version = "0.1.0"
description = "LLM provider chain (Groq / Cerebras / local llama.cpp / deterministic), token budget ledger and tool-call runtime"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.28",
  "reluai-core",
]

[tool.uv.sources]
reluai-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reluai_inference"]
