[project]
name = "reluai-document-intelligence"
version = "0.1.0"
description = "Document Intelligence: question answering with page citations over uploaded PDFs (text layer or OCR, hybrid search), and invoice extraction measured against real records"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.142",
  "numpy>=2.2",
  "onnxruntime>=1.22",
  "pypdfium2>=4.30",
  "python-multipart>=0.0.20",
  "rapidocr>=3.4",
  "reportlab>=4.4",
  "reluai-core",
  "reluai-datasets",
  "reluai-inference",
  "reluai-retrieval",
]

[dependency-groups]
# Only for the image build: writes the INT8 copy of the embedding model (reluai-docs quantize).
quantize = ["onnx>=1.17"]

[project.scripts]
reluai-docs = "reluai_docs.cli:main"

[tool.uv.sources]
reluai-core = { workspace = true }
reluai-datasets = { workspace = true }
reluai-inference = { workspace = true }
reluai-retrieval = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reluai_docs"]
